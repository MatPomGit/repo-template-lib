name: Scaffold CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scaffold-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    # Private descendants must opt in to potentially billed CI separately.
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Validate scaffold
        run: python scripts/validate_repository.py --phase scaffold
      - name: Check documentation budgets
        run: python scripts/validate_documentation.py
      - name: Check isolated public Pages
        run: python scripts/validate_pages.py
      - name: Run regression tests
        run: python -m unittest discover -s tests -v
      - name: Build and inspect approved Pages (never deploy)
        run: |
          python -m pip install --disable-pip-version-check "mkdocs==1.6.1"
          python -m mkdocs build --strict
          python scripts/validate_rendered_pages.py
